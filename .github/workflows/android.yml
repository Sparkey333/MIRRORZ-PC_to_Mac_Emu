name: android
on:
  push:
    paths: ['apps/android/**', 'core/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'core/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM core tests
        run: |
          cd apps/android 2>/dev/null || { echo "android project not present yet"; exit 0; }
          gradle :core:test --no-daemon
      - name: Assemble debug
        run: |
          cd apps/android 2>/dev/null || { echo "android project not present yet"; exit 0; }
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: companion-debug-apk, path: apps/android/app/build/outputs/apk/debug/*.apk, if-no-files-found: ignore }
