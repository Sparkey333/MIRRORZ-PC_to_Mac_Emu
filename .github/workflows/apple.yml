name: apple
on:
  push:
    paths: ['apps/shared/**', 'apps/macos/**', 'apps/ios/**', 'core/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apps/shared/**', 'apps/macos/**', 'apps/ios/**', 'core/**', '.github/workflows/apple.yml']
jobs:
  kit:
    name: MirrorzKit (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Build & test MirrorzKit (macOS)
        working-directory: apps/shared/MirrorzKit
        run: swift build && swift test
  engine:
    name: MirrorzEngine (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Build & test MirrorzEngine
        run: |
          cd apps/macos/Packages/MirrorzEngine 2>/dev/null || { echo "engine package not present yet"; exit 0; }
          swift build && swift test
  macos-app:
    name: MIRRORZ macOS app (unsigned)
    runs-on: macos-15
    needs: [kit]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apps/macos
        run: test -f project.yml && xcodegen generate || echo "project.yml not present yet"
      - name: Build
        working-directory: apps/macos
        run: |
          test -d MIRRORZ.xcodeproj || exit 0
          xcodebuild -project MIRRORZ.xcodeproj -scheme MIRRORZ -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        working-directory: apps/macos
        run: |
          test -d MIRRORZ.xcodeproj || exit 0
          xcodebuild -project MIRRORZ.xcodeproj -scheme MIRRORZ -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test || true
  ios-app:
    name: MIRRORZ companion (iOS simulator)
    runs-on: macos-15
    needs: [kit]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - name: Generate & build
        run: |
          cd apps/ios 2>/dev/null || { echo "ios app not present yet"; exit 0; }
          test -f project.yml || { echo "project.yml not present yet"; exit 0; }
          xcodegen generate
          xcodebuild -project MIRRORZCompanion.xcodeproj -scheme MIRRORZCompanion -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
