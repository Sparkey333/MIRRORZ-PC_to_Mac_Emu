name: App compatibility report
description: Tell us how a Windows/PC app runs in MIRRORZ
labels: [compatibility]
body:
  - type: input
    id: app
    attributes: { label: App name and version, placeholder: "AutoCAD 2026" }
    validations: { required: true }
  - type: dropdown
    id: runtime
    attributes: { label: Runtime, options: [Machine (Windows 11 ARM), Bottle, Not sure] }
    validations: { required: true }
  - type: dropdown
    id: result
    attributes: { label: Result, options: [Works, Works with fix-ups, Partial, Broken] }
    validations: { required: true }
  - type: input
    id: mac
    attributes: { label: Mac model and macOS version, placeholder: "MacBook Pro M4 Pro, macOS 26.1" }
  - type: textarea
    id: notes
    attributes: { label: What happened, description: Steps, error text, screenshots. Do not include license keys. }
